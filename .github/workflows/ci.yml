name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Dependencies are built with `--cap-lints allow`, so this only ever fails on
  # warnings from this crate.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Rustdoc
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      # `--all-targets` covers lib, integration tests and the `listen` example,
      # but deliberately excludes doctests, hence the second invocation.
      - name: Tests
        run: cargo test --all-targets --locked

      - name: Doc tests
        run: cargo test --doc --locked

  msrv:
    name: MSRV 1.86
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # `--locked` matters here: the MSRV holds for the committed dependency
      # graph, not for whatever a fresh resolve would pick.
      - name: Install 1.86
        run: rustup toolchain install 1.86 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo +1.86 check --all-targets --locked
