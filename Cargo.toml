#:schema https://raw.githubusercontent.com/rust-lang/cargo/master/crates/cargo-util-schemas/manifest.schema.json

[package]
name = "loxwebsocket"
version = "0.1.0"
edition = "2024"
# Edition 2024 requires 1.85; the committed Cargo.lock separately pulls
# `url` → `idna` → `icu_*`, which need 1.86.
rust-version = "1.86"
description = "High-performance Loxone Miniserver WebSocket client: zero-copy binary event tables, token auth and TLS pinning. Direct connections only — CloudDNS remote connect is not implemented."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Jakob-Gliwa/loxwebsocketclient-rs"
keywords = ["loxone", "websocket", "miniserver", "smarthome", "iot"]
categories = ["network-programming", "asynchronous"]
exclude = ["refs/"]
# `benches/`, `examples/capture.rs` and `examples/parity.rs` are local-only dev
# tooling (see README § Crate layout), gitignored and absent from a fresh
# checkout. Autodiscovery would otherwise pick them up and fail to compile.
autobenches = false
autoexamples = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
x509-cert = "0.3"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha1", "sha2"] }
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
percent-encoding = "2.3"
sonic-rs = "0.5"
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
bytes = "1"
rand = "0.8"
url = "2"
hex = "0.4"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "listen"
path = "examples/listen.rs"

[profile.release]
lto = true
codegen-units = 1
